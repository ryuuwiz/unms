[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; Web server — persis perintah yang dipakai provider PHP milik Railpack.
; Jangan diganti tanpa mengecek ulang core/providers/php/start-container.sh.
; ---------------------------------------------------------------------------
[program:frankenphp]
command=docker-php-entrypoint --config /Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startretries=3
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Laravel Horizon
; stopsignal=TERM: Horizon menunggu job berjalan selesai sebelum mati.
; stopwaitsecs harus >= job Mikrotik terlama supaya tidak di-SIGKILL di tengah.
; ---------------------------------------------------------------------------
[program:horizon]
command=php /app/artisan horizon
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=3
priority=20
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Scheduler via supercronic (menggantikan schedule:work / crond)
; ---------------------------------------------------------------------------
[program:scheduler]
command=/usr/local/bin/supercronic /app/deploy/crontab
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=3
priority=30
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0