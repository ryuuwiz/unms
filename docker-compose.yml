services:
  # ---------------------------------------------------------------------------
  # Application Core (Production PHP 8.5-FPM + Nginx + Horizon + Scheduler via Supervisord)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    pull_policy: build
    image: ${APP_IMAGE:-gobilling-app:prod}
    container_name: gobilling_app
    restart: unless-stopped
    working_dir: /var/www/html
    stop_signal: SIGTERM
    stop_grace_period: 60s
    environment:
      - APP_NAME=${APP_NAME:-GOBILLING}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://${APP_DOMAIN:-buroq.gobilling.id}}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-gobilling}
      - DB_USERNAME=${DB_USERNAME:-gobilling}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - CREATE_STORAGE_LINK=true
      - CACHE_ON_STARTUP=${CACHE_ON_STARTUP:-true}
      - WAHA_HOST=${WAHA_HOST:-http://waha:3000}
      - WAHA_SESSION=${WAHA_SESSION:-gobilling}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${DOKPLOY_ROUTER_NAME:-gobilling}.rule=Host(`${APP_DOMAIN:-buroq.gobilling.id}`)"
      - "traefik.http.routers.${DOKPLOY_ROUTER_NAME:-gobilling}.entrypoints=websecure"
      - "traefik.http.routers.${DOKPLOY_ROUTER_NAME:-gobilling}.tls=true"
      - "traefik.http.routers.${DOKPLOY_ROUTER_NAME:-gobilling}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${DOKPLOY_ROUTER_NAME:-gobilling}.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network
      - dokploy-network

  # ---------------------------------------------------------------------------
  # Database (MySQL 8.4 LTS - Internal Network Only)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: gobilling_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root}
      MYSQL_DATABASE: ${DB_DATABASE:-gobilling}
      MYSQL_USER: ${DB_USERNAME:-gobilling}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # In-Memory Cache & Horizon Queue Broker (Redis 7 - Internal Network Only)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gobilling_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # WhatsApp Engine / Gateway (WAHA - Internal Network Only)
  # ---------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha:latest
    container_name: gobilling_waha
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: https://${APP_DOMAIN:-buroq.gobilling.id}/api/whatsapp/webhook
      WAHA_DASHBOARD_USERNAME: ${WAHA_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_PASSWORD:-secret}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - waha_sessions:/app/.sessions
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

networks:
  gobilling_network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  app_storage:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  waha_sessions:
    driver: local
