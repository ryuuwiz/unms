services:
  # ---------------------------------------------------------------------------
  # Application Core (PHP 8.5-FPM + Nginx + Horizon + Scheduler via Supervisord)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: unms-app:dev
    container_name: gobilling_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/supervisor/supervisord.conf:/etc/supervisord.conf:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - REDIS_HOST=redis
    env_file:
      - .env
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Database (MySQL 8.4 LTS)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: gobilling_mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root}
      MYSQL_DATABASE: ${DB_DATABASE:-gobilling}
      MYSQL_USER: ${DB_USERNAME:-gobilling}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # In-Memory Cache & Queue Broker (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gobilling_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Local Mail Catcher (Mailpit)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: gobilling_mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - gobilling_network

networks:
  gobilling_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
