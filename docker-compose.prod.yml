name: gobilling-prod

services:
  # ----------------------------------------------------------------------------
  # Production PHP-FPM Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: gobilling-app:prod
    container_name: gobilling_prod_app
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - gobilling_prod_storage_app:/var/www/html/storage/app
      - gobilling_prod_storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gobilling-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production Nginx Web Server (Internal Reverse Proxy Target)
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: gobilling-nginx:prod
    container_name: gobilling_prod_nginx
    restart: always
    ports:
      # Bound to 127.0.0.1 for Host Reverse Proxy / Cloudflare Tunnel / SSL termination
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - gobilling_prod_storage_app:/var/www/html/storage/app:ro
    depends_on:
      - app
    networks:
      - gobilling-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production Laravel Horizon Worker Service
  # ----------------------------------------------------------------------------
  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: gobilling-app:prod
    container_name: gobilling_prod_horizon
    restart: always
    working_dir: /var/www/html
    command: php artisan horizon
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - gobilling_prod_storage_app:/var/www/html/storage/app
      - gobilling_prod_storage_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gobilling-prod-network
    stop_grace_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production Laravel Task Scheduler Service
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: gobilling-app:prod
    container_name: gobilling_prod_scheduler
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - gobilling_prod_storage_app:/var/www/html/storage/app
      - gobilling_prod_storage_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gobilling-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production MySQL 8.4 LTS Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: gobilling_prod_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-gobilling}"
      MYSQL_USER: "${DB_USERNAME:-gobilling}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - gobilling_prod_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - gobilling-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production Redis 7 Cache & Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gobilling_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - gobilling_prod_redis_data:/data
    networks:
      - gobilling-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Production WAHA (WhatsApp HTTP API) Service
  # ----------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha:latest
    container_name: gobilling_prod_waha
    restart: always
    environment:
      WAHA_ZIP_LOGS: "true"
      WAHA_PRINT_QR: "false"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_API_KEY: "${WAHA_API_KEY}"
    volumes:
      - gobilling_prod_waha_sessions:/app/.sessions
    networks:
      - gobilling-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  gobilling-prod-network:
    driver: bridge

volumes:
  gobilling_prod_db_data:
    driver: local
  gobilling_prod_redis_data:
    driver: local
  gobilling_prod_storage_app:
    driver: local
  gobilling_prod_storage_logs:
    driver: local
  gobilling_prod_waha_sessions:
    driver: local
