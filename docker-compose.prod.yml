services:
  # ---------------------------------------------------------------------------
  # Application Core (Production PHP 8.5-FPM)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: unms-app:prod
    container_name: gobilling_prod_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Web Server (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: gobilling_prod_nginx
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 for host reverse proxy (Traefik, Cloudflare Tunnel, or Host Nginx)
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Queue Worker (Laravel Horizon)
  # ---------------------------------------------------------------------------
  horizon:
    image: unms-app:prod
    container_name: gobilling_prod_horizon
    command: php artisan horizon
    restart: unless-stopped
    working_dir: /var/www/html
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Task Scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    image: unms-app:prod
    container_name: gobilling_prod_scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Database (MySQL 8.4 LTS - Internal Only, No Exposed Host Ports)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: gobilling_prod_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-gobilling}
      MYSQL_USER: ${DB_USERNAME:-gobilling}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

  # ---------------------------------------------------------------------------
  # Cache & Queue Broker (Redis 7 - Internal Only, No Exposed Host Ports)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gobilling_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - gobilling_network

networks:
  gobilling_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
