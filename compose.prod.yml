# =============================================================================
# GOBILLING (UNMS) - Production Docker Compose Specification
# Conforming to the latest Docker Compose Specification (v2+)
# Dokploy handles Traefik ingress dynamically without inline compose labels.
# =============================================================================

# Global reusable configurations via YAML anchors (DRY Specification)
x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "20m"
        max-file: "5"

x-app-base: &app-base
    build:
        context: .
        dockerfile: docker/Dockerfile
        target: production
    restart: unless-stopped
    logging: *default-logging
    security_opt:
        - "no-new-privileges:true"
    volumes:
        - gobilling_storage:/var/www/html/storage
    networks:
        - gobilling_internal
    environment: &app-environment
        APP_NAME: "${APP_NAME:-GOBILLING}"
        APP_ENV: "${APP_ENV:-production}"
        APP_KEY: "${APP_KEY}"
        APP_DEBUG: "${APP_DEBUG:-false}"
        APP_URL: "${APP_URL:-http://localhost:8000}"
        APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
        APP_LOCALE: "${APP_LOCALE:-id}"
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: "${DB_DATABASE:-gobilling}"
        DB_USERNAME: "${DB_USERNAME:-gobilling}"
        DB_PASSWORD: "${DB_PASSWORD:-secret}"
        REDIS_CLIENT: phpredis
        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
        CACHE_STORE: redis
        SESSION_DRIVER: redis
        QUEUE_CONNECTION: redis
        HORIZON_PREFIX: "${HORIZON_PREFIX:-gobilling_horizon:}"
        FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
        MEDIA_DISK: "${MEDIA_DISK:-public}"
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-rustfsadmin}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-rustfssecret}"
        AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
        AWS_BUCKET: "${AWS_BUCKET:-gobilling}"
        AWS_ENDPOINT: "${AWS_ENDPOINT:-http://rustfs:9000}"
        AWS_URL: "${AWS_URL:-http://localhost:9000/gobilling}"
        AWS_USE_PATH_STYLE_ENDPOINT: "true"
        WAHA_HOST: "http://waha:3000"
        WAHA_API_KEY: "${WAHA_API_KEY:-}"
        WAHA_SESSION: "${WAHA_SESSION:-gobilling}"
        XENDIT_SECRET_KEY: "${XENDIT_SECRET_KEY:-}"
        XENDIT_CALLBACK_TOKEN: "${XENDIT_CALLBACK_TOKEN:-}"
        XENDIT_ENV: "${XENDIT_ENV:-production}"
        MAIL_MAILER: "${MAIL_MAILER:-log}"
        MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
        MAIL_PORT: "${MAIL_PORT:-1025}"
        MAIL_USERNAME: "${MAIL_USERNAME:-}"
        MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
        MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-null}"
        MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-billing@domainanda.id}"
        MAIL_FROM_NAME: "${MAIL_FROM_NAME:-GOBILLING}"

services:
    app:
        <<: *app-base
        container_name: gobilling_app
        ports:
            - "${APP_PORT:-8000}:80"
        environment:
            <<: *app-environment
            CONTAINER_ROLE: app
            RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://127.0.0.1/up || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        depends_on:
            mysql:
                condition: service_healthy
                restart: true
            redis:
                condition: service_healthy
                restart: true
            rustfs:
                condition: service_healthy
                restart: true
        deploy:
            resources:
                limits:
                    cpus: "${APP_CPU_LIMIT:-2.0}"
                    memory: "${APP_MEMORY_LIMIT:-1024M}"
                reservations:
                    memory: "${APP_MEMORY_RESERVATION:-256M}"

    horizon:
        <<: *app-base
        container_name: gobilling_horizon
        command: ["php", "artisan", "horizon"]
        init: true
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "php artisan horizon:status || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 60s
        environment:
            <<: *app-environment
            CONTAINER_ROLE: horizon
        depends_on:
            mysql:
                condition: service_healthy
                restart: true
            redis:
                condition: service_healthy
                restart: true
        deploy:
            resources:
                limits:
                    cpus: "${HORIZON_CPU_LIMIT:-1.5}"
                    memory: "${HORIZON_MEMORY_LIMIT:-1024M}"
                reservations:
                    memory: "${HORIZON_MEMORY_RESERVATION:-256M}"

    scheduler:
        <<: *app-base
        container_name: gobilling_scheduler
        command: ["supercronic", "/etc/crontabs/laravel-cron"]
        init: true
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'supercronic' || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        environment:
            <<: *app-environment
            CONTAINER_ROLE: scheduler
        depends_on:
            mysql:
                condition: service_healthy
                restart: true
            redis:
                condition: service_healthy
                restart: true
        deploy:
            resources:
                limits:
                    cpus: "${SCHEDULER_CPU_LIMIT:-0.5}"
                    memory: "${SCHEDULER_MEMORY_LIMIT:-256M}"

    mysql:
        image: 'mysql:8.4'
        container_name: gobilling_mysql
        restart: unless-stopped
        logging: *default-logging
        command:
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_unicode_ci'
            - '--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-512M}'
            - '--innodb-redo-log-capacity=256M'
            - '--max-connections=150'
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
            MYSQL_DATABASE: "${DB_DATABASE:-gobilling}"
            MYSQL_USER: "${DB_USERNAME:-gobilling}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - gobilling_mysql_data:/var/lib/mysql
        networks:
            - gobilling_internal
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "${MYSQL_CPU_LIMIT:-2.0}"
                    memory: "${MYSQL_MEMORY_LIMIT:-1536M}"
                reservations:
                    memory: "${MYSQL_MEMORY_RESERVATION:-512M}"

    redis:
        image: 'redis:7-alpine'
        container_name: gobilling_redis
        restart: unless-stopped
        logging: *default-logging
        command:
            - 'sh'
            - '-c'
            - 'if [ -n "$${REDIS_PASSWORD}" ] && [ "$${REDIS_PASSWORD}" != "null" ]; then redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction; else redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction; fi'
        volumes:
            - gobilling_redis_data:/data
        networks:
            - gobilling_internal
        healthcheck:
            test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ] && [ \"$$REDIS_PASSWORD\" != \"null\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1; else redis-cli ping | grep PONG || exit 1; fi"]
            interval: 5s
            timeout: 3s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: "${REDIS_MEMORY_LIMIT:-512M}"

    rustfs:
        image: 'rustfs/rustfs:latest'
        container_name: gobilling_rustfs
        restart: unless-stopped
        logging: *default-logging
        ports:
            - "${FORWARD_RUSTFS_PORT:-9000}:9000"
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-rustfsadmin}"
            RUSTFS_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-rustfssecret}"
            RUSTFS_LOG_LEVEL: info
        volumes:
            - gobilling_rustfs_data:/data
        networks:
            - gobilling_internal
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    memory: "${RUSTFS_MEMORY_LIMIT:-512M}"

    waha:
        image: 'devlikeapro/waha:latest'
        container_name: gobilling_waha
        restart: unless-stopped
        logging: *default-logging
        environment:
            WHATSAPP_API_KEY: "${WAHA_API_KEY:-}"
            WHATSAPP_HOOK_URL: "http://app/api/whatsapp/webhook"
            WAHA_DASHBOARD_ENABLED: 'true'
            WAHA_LOG_LEVEL: info
        volumes:
            - gobilling_waha_sessions:/app/.sessions
        networks:
            - gobilling_internal
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ping || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    cpus: "${WAHA_CPU_LIMIT:-1.5}"
                    memory: "${WAHA_MEMORY_LIMIT:-1024M}"

networks:
    gobilling_internal:
        driver: bridge

volumes:
    gobilling_storage:
        driver: local
    gobilling_mysql_data:
        driver: local
    gobilling_redis_data:
        driver: local
    gobilling_rustfs_data:
        driver: local
    gobilling_waha_sessions:
        driver: local
