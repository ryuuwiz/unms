[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
; Redis runs as its own Dokploy service and can restart independently of this
; container. Supervisor's default startretries=3 means 3 quick connection
; failures during a Redis restart permanently mark this FATAL with no further
; retries (see ADR-0036) -- a high startretries keeps it retrying past that
; window instead of needing a manual restart once Redis comes back.
startretries=1000000
user=www-data
numprocs=1
redirect_stderr=true
stopwaitsecs=60
stopsignal=TERM
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0