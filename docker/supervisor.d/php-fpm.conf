[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=5
; php-fpm's graceful-shutdown signal is SIGQUIT (SIGTERM kills in-flight
; requests immediately). stopwaitsecs mirrors php.ini's max_execution_time
; so the longest-running request has time to finish before SIGKILL.
stopsignal=QUIT
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0