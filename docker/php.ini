; Override runtime untuk GOBILLING production
; (dimuat di /usr/local/etc/php/conf.d/99-app.ini, setelah default PHP)

date.timezone = Asia/Jakarta
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; -- OPcache -------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode cuma berubah saat redeploy (image baru), jadi lewati cek mtime.
opcache.validate_timestamps = 0
; Jangan sertakan argumen fungsi di stack trace (Query RouterOS membawa password PPP).
zend.exception_ignore_args = On
