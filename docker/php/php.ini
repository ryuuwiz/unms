memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
expose_php = Off
date.timezone = Asia/Jakarta

; Mikrotik RouterOS API / Xendit HTTP calls can be slow on flaky ISP links —
; give outbound calls headroom without letting a bad router hang a worker forever.
default_socket_timeout = 30
