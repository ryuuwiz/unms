[PHP]
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000

date.timezone = Asia/Jakarta
expose_php = Off
variables_order = "EGPCS"

# Error reporting
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
