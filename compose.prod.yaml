services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    expose:
      - "9000"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - php
      - artisan
      - horizon
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - php
      - artisan
      - schedule:work
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public

volumes:
  app_storage:
    driver: local

  app_public:
    driver: local